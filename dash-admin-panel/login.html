<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Admin — Jaya Cleaning</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <style>
        :root {
            --bg: #f4f5f2;
            --surface: #ffffff;
            --text: #171918;
            --muted: #747873;
            --line: #dedfda;
            --accent: #1f2a24;
            --accent-hover: #111914;
            --danger: #b53d3d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .login-shell {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            margin-bottom: 20px;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 7vw, 42px);
            line-height: 1.05;
            letter-spacing: -0.045em;
            font-weight: 650;
        }

        .intro {
            max-width: 380px;
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.65;
        }

        .login-card {
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            box-shadow:
                0 12px 35px rgba(20, 25, 22, 0.05);
        }

        .field {
            margin-bottom: 19px;
        }

        .field:last-of-type {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 650;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            background: #fff;
            color: var(--text);
            transition:
                border-color 160ms ease,
                box-shadow 160ms ease;
        }

        input::placeholder {
            color: #a2a49f;
        }

        input:focus {
            border-color: #798079;
            box-shadow:
                0 0 0 3px rgba(31, 42, 36, 0.08);
        }

        .password-input {
            padding-right: 76px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            height: 34px;
            padding: 0 9px;
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            font-weight: 650;
        }

        .password-toggle:hover {
            color: var(--text);
        }

        .submit-button {
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            transition:
                background 160ms ease,
                transform 160ms ease,
                opacity 160ms ease;
        }

        .submit-button:hover {
            background: var(--accent-hover);
        }

        .submit-button:active {
            transform: translateY(1px);
        }

        .submit-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 13px;
            border: 1px solid #e6caca;
            border-radius: 9px;
            background: #fff7f7;
            color: var(--danger);
            font-size: 13px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #999c96;
            font-size: 11px;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 700ms linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                padding: 38px 18px 24px;
            }

            .brand {
                margin-bottom: 22px;
            }

            .login-card {
                padding: 22px;
                border-radius: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="login-shell">

        <header class="brand">
            <div
                class="brand-mark"
                aria-hidden="true"
            >
                JC
            </div>

            <p class="eyebrow">
                Jaya Cleaning
            </p>

            <h1>
                Admin Panel
            </h1>

            <p class="intro">
                Masuk untuk mengelola konten,
                layanan, galeri, dan pengaturan
                website Jaya Cleaning.
            </p>
        </header>


        <section class="login-card">

            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>


            <form
                id="loginForm"
                novalidate
            >

                <div class="field">
                    <label
                        for="username"
                    >
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Masukkan username"
                        required
                        maxlength="100"
                        autofocus
                    >
                </div>


                <div class="field">
                    <label
                        for="password"
                    >
                        Password
                    </label>

                    <div class="input-wrap">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="password-input"
                            autocomplete="current-password"
                            placeholder="Masukkan password"
                            required
                            maxlength="200"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Tampilkan password"
                        >
                            Tampilkan
                        </button>

                    </div>
                </div>


                <button
                    type="submit"
                    class="submit-button"
                    id="submitButton"
                >
                    <span id="submitText">
                        Masuk ke Dashboard
                    </span>
                </button>

            </form>

        </section>


        <footer class="footer">
            Jaya Cleaning · Admin
        </footer>

    </main>


    <script>
        (() => {

            const form =
                document.getElementById(
                    "loginForm"
                );

            const usernameInput =
                document.getElementById(
                    "username"
                );

            const passwordInput =
                document.getElementById(
                    "password"
                );

            const passwordToggle =
                document.getElementById(
                    "passwordToggle"
                );

            const message =
                document.getElementById(
                    "message"
                );

            const submitButton =
                document.getElementById(
                    "submitButton"
                );

            const submitText =
                document.getElementById(
                    "submitText"
                );


            /*
            |--------------------------------------------------------------------------
            | SHOW MESSAGE
            |--------------------------------------------------------------------------
            */

            function showMessage(
                text
            ) {
                message.textContent =
                    text;

                message.classList.add(
                    "show"
                );
            }


            /*
            |--------------------------------------------------------------------------
            | HIDE MESSAGE
            |--------------------------------------------------------------------------
            */

            function hideMessage() {
                message.textContent =
                    "";

                message.classList.remove(
                    "show"
                );
            }


            /*
            |--------------------------------------------------------------------------
            | PASSWORD TOGGLE
            |--------------------------------------------------------------------------
            */

            passwordToggle.addEventListener(
                "click",
                () => {

                    const showing =
                        passwordInput.type ===
                        "text";

                    passwordInput.type =
                        showing
                            ? "password"
                            : "text";

                    passwordToggle.textContent =
                        showing
                            ? "Tampilkan"
                            : "Sembunyikan";

                    passwordToggle.setAttribute(
                        "aria-label",
                        showing
                            ? "Tampilkan password"
                            : "Sembunyikan password"
                    );
                }
            );


            /*
            |--------------------------------------------------------------------------
            | CHECK EXISTING SESSION
            |--------------------------------------------------------------------------
            */

            async function checkExistingSession() {

                try {

                    const response =
                        await fetch(
                            "/api/auth/me",
                            {
                                method: "GET",
                                credentials:
                                    "same-origin",
                                headers: {
                                    "Accept":
                                        "application/json"
                                },
                                cache: "no-store"
                            }
                        );


                    if (!response.ok) {
                        return;
                    }


                    const result =
                        await response.json();


                    if (
                        result &&
                        result.success &&
                        result.authenticated
                    ) {
                        window.location.replace(
                            "/dash-admin-panel/"
                        );
                    }

                } catch {
                    /*
                     * Tidak perlu menampilkan error
                     * saat pengecekan session.
                     */
                }
            }


            /*
            |--------------------------------------------------------------------------
            | LOGIN
            |--------------------------------------------------------------------------
            */

            form.addEventListener(
                "submit",
                async event => {

                    event.preventDefault();

                    hideMessage();


                    const username =
                        usernameInput.value.trim();

                    const password =
                        passwordInput.value;


                    /*
                     * Validasi client-side.
                     */

                    if (!username) {

                        showMessage(
                            "Username wajib diisi."
                        );

                        usernameInput.focus();

                        return;
                    }


                    if (!password) {

                        showMessage(
                            "Password wajib diisi."
                        );

                        passwordInput.focus();

                        return;
                    }


                    /*
                     * Loading state.
                     */

                    submitButton.disabled =
                        true;

                    submitText.innerHTML = `
                        <span class="loading">
                            <span
                                class="spinner"
                                aria-hidden="true"
                            ></span>
                            Memeriksa...
                        </span>
                    `;


                    try {

                        const response =
                            await fetch(
                                "/api/auth/login",
                                {
                                    method: "POST",

                                    credentials:
                                        "same-origin",

                                    headers: {
                                        "Content-Type":
                                            "application/json",

                                        "Accept":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            username,
                                            password
                                        })
                                }
                            );


                        let result = null;


                        try {
                            result =
                                await response.json();
                        } catch {
                            result = null;
                        }


                        /*
                         * Login gagal.
                         */

                        if (
                            !response.ok ||
                            !result ||
                            !result.success
                        ) {

                            showMessage(
                                result &&
                                result.message
                                    ? result.message
                                    : "Username atau password salah."
                            );

                            passwordInput.value =
                                "";

                            passwordInput.focus();

                            return;
                        }


                        /*
                         * Login berhasil.
                         */

                        submitText.textContent =
                            "Berhasil masuk";


                        window.location.replace(
                            "/dash-admin-panel/"
                        );

                    } catch (error) {

                        console.error(
                            "LOGIN ERROR:",
                            error
                        );

                        showMessage(
                            "Tidak dapat terhubung ke server. Periksa koneksi dan coba lagi."
                        );

                    } finally {

                        submitButton.disabled =
                            false;

                        /*
                         * Jangan mengubah tombol
                         * setelah redirect berhasil.
                         */

                        if (
                            document.visibilityState !==
                            "hidden"
                        ) {
                            submitText.textContent =
                                "Masuk ke Dashboard";
                        }
                    }
                }
            );


            /*
            |--------------------------------------------------------------------------
            | START
            |--------------------------------------------------------------------------
            */

            checkExistingSession();

        })();
    </script>

</body>
</html>
